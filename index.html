<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardlife Sales Dashboard 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --white:#ffffff;
    --paper:#f6f5f3;
    --black:#161513;
    --ink:#232220;
    --orange:#e35205;
    --orange-light:#ff8a3d;
    --amber:#f0a830;
    --grey:#7a7670;
    --line:#e3e0da;
    --line-dark:#33312d;
    --good:#3a7d44;
    --bad:#c0392b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Barlow', sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.2px; }
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:220px; flex:0 0 220px;
    background:var(--black); color:var(--white);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ padding:28px 22px 18px; border-bottom:1px solid var(--line-dark); }
  .brand .mark{
    display:inline-block; width:34px; height:34px; background:var(--orange);
    clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
    margin-bottom:10px;
  }
  .brand h1{ font-size:22px; color:var(--white); line-height:1; text-transform:uppercase; }
  .brand p{ font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:1.2px; margin-top:4px; }

  nav{ flex:1; padding:14px 10px; }
  nav button{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; color:#cfcdc8; text-align:left;
    font-family:'Barlow', sans-serif; font-size:14.5px; font-weight:600;
    padding:11px 12px; margin-bottom:2px; cursor:pointer; border-radius:2px;
    border-left:3px solid transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  nav button .num{ font-family:'Barlow Condensed'; font-size:12px; color:var(--grey); border:1px solid var(--line-dark); border-radius:2px; padding:1px 6px; margin-left:auto; }
  nav button:hover{ background:#221f1c; color:var(--white); }
  nav button.active{ background:#221f1c; color:var(--white); border-left-color:var(--orange); }

  .sidebar-foot{ padding:16px 22px 22px; border-top:1px solid var(--line-dark); }
  .sidebar-foot button{
    width:100%; background:var(--orange); color:var(--white); border:none;
    font-family:'Barlow', sans-serif; font-weight:700; font-size:13px;
    padding:10px 12px; cursor:pointer; letter-spacing:.3px;
  }
  .sidebar-foot button:hover{ background:var(--orange-light); }
  .sidebar-foot input{ display:none; }
  .sidebar-foot .fname{ font-size:11px; color:var(--grey); margin-top:8px; word-break:break-all; }

  main{ flex:1; min-width:0; padding:26px 34px 60px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:20px; }
  .topbar h2{ font-size:30px; text-transform:uppercase; }
  .topbar .sub{ color:var(--grey); font-size:13px; margin-top:2px; }

  .filters{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:var(--white); border:1px solid var(--line); padding:12px 16px; margin-bottom:22px;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family:'Barlow Condensed'; font-size:14px; font-weight:700;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:5px 12px; cursor:pointer; user-select:none;
  }
  .chip.on{ background:var(--black); color:var(--white); border-color:var(--black); }
  .chip.q{ border-color:var(--orange); }
  .chip.q.on{ background:var(--orange); border-color:var(--orange); }
  .seg{ display:flex; border:1px solid var(--line); }
  .seg button{
    font-family:'Barlow'; font-weight:600; font-size:12.5px; padding:7px 14px; background:var(--white); border:none; cursor:pointer; color:var(--ink);
    border-right:1px solid var(--line);
  }
  .seg button:last-child{ border-right:none; }
  .seg button.on{ background:var(--orange); color:var(--white); }
  .filters .spacer{ flex:1; }
  .filters .note{ font-size:11.5px; color:var(--grey); }

  .grid{ display:grid; gap:16px; }
  .g2{ grid-template-columns:1fr 1fr; }
  .g3{ grid-template-columns:1fr 1fr 1fr; }
  .g4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:1100px){ .g2,.g3,.g4{ grid-template-columns:1fr 1fr; } }

  .card{ background:var(--white); border:1px solid var(--line); padding:18px; }
  .card h3{ font-size:16px; text-transform:uppercase; margin-bottom:2px; }
  .card .cap{ font-size:11.5px; color:var(--grey); margin-bottom:14px; }
  .card.tall canvas{ max-height:280px; }

  .kpi{ background:var(--white); border:1px solid var(--line); border-top:4px solid var(--orange); padding:16px 18px; }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--grey); font-weight:600; }
  .kpi .value{ font-family:'Barlow Condensed'; font-size:34px; font-weight:800; line-height:1.1; margin-top:4px; }
  .kpi .delta{ font-size:12px; margin-top:4px; font-weight:600; }
  .kpi .delta.pos{ color:var(--good); }
  .kpi .delta.neg{ color:var(--bad); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-family:'Barlow Condensed'; font-size:12.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--grey); border-bottom:2px solid var(--black); padding:7px 8px; }
  td{ padding:7px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  tr:hover td{ background:var(--paper); }
  .num{ text-align:right; }
  .tag{ display:inline-block; font-size:11px; padding:2px 7px; border:1px solid var(--line); font-weight:600; }
  .tag.att{ border-color:var(--orange); color:var(--orange); }
  .tag.util{ border-color:var(--amber); color:#a5751c; }

  .empty{ color:var(--grey); font-size:13px; padding:20px; text-align:center; }
  .section-title{ margin:28px 0 12px; font-size:20px; text-transform:uppercase; border-left:4px solid var(--orange); padding-left:10px; }
  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; }
  .scroll-x{ overflow-x:auto; }
  footer.note{ margin-top:30px; font-size:11.5px; color:var(--grey); border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="brand">
      <span class="mark"></span>
      <h1>Hardlife</h1>
      <p>Sales Dashboard</p>
    </div>
    <nav id="nav">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="segments">Segments</button>
      <button data-tab="salespeople">Salespeople</button>
      <button data-tab="uncaptured">Uncaptured Demand</button>
      <button data-tab="quality">Quality</button>
      <button data-tab="personal">Personal Dashboard</button>
    </nav>
    <div class="sidebar-foot">
      <button type="button" id="uploadBtn">Upload updated file</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
      <div class="fname" id="fname">Built-in data · Jan – Oct 2026</div>
    </div>
  </div>

  <main>
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Overview</h2>
        <div class="sub" id="pageSub">Sales funnel, conversion and target performance</div>
      </div>
    </div>

    <div class="filters">
      <div class="chip-row" id="monthChips"></div>
      <div class="seg">
        <button id="viewMonth" class="on">Monthly</button>
        <button id="viewQuarter">Quarterly</button>
      </div>
      <div class="spacer"></div>
    </div>

    <div id="panels"></div>
  </main>
</div>

const MONTHS_ALL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL_NAME = {Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};
function monthIndex(m){ return MONTHS_ALL.indexOf(m); }
function quarterOf(m){ return 'Q' + (Math.floor(monthIndex(m)/3)+1); }

let DATA = JSON.parse(JSON.stringify(RAW_DATA));

const COLORS = { orange:'#e35205', orangeLight:'#ff8a3d', amber:'#f0a830', black:'#161513', grey:'#7a7670', good:'#3a7d44', bad:'#c0392b' };
const PALETTE = [COLORS.orange, COLORS.black, COLORS.amber, '#8a5a2b', COLORS.grey, COLORS.bad, COLORS.good, COLORS.orangeLight];

const PEOPLE_PALETTE = ['#2c6e8a', '#e35205', '#3a7d44', '#7a4fa3', '#c0392b', '#c9a227', '#1b8f8f', '#5b5852'];

function availableMonths(){ return Object.keys(DATA).sort((a,b)=>monthIndex(a)-monthIndex(b)); }

const state = { months: new Set(availableMonths()), granularity:'month', tab:'overview', person:null };

function fmtGBP(v){ if(v==null||isNaN(v)) return '£0'; return '£' + Math.round(v).toLocaleString('en-GB'); }
function fmtNum(v){ if(v==null||isNaN(v)) return '0'; return Math.round(v).toLocaleString('en-GB'); }
function fmtPct(v){ if(v==null||isNaN(v)) return '—'; return (v*100).toFixed(1)+'%'; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function safeDiv(a,b){ return b ? a/b : null; }

function selectedMonthsSorted(){
  return availableMonths().filter(m=>state.months.has(m));
}
function getGroups(){
  const months = selectedMonthsSorted();
  if(state.granularity==='month'){
    return months.map(m=>({label:m, months:[m]}));
  }
  const byQ = {};
  months.forEach(m=>{ const q=quarterOf(m); (byQ[q]=byQ[q]||[]).push(m); });
  return Object.keys(byQ).sort().map(q=>({label:q, months:byQ[q]}));
}

function aggFunnel(months){
  let e=0,q=0,o=0,t=0;
  months.forEach(m=>{ const f=DATA[m].funnel; e+=f.enquiries||0; q+=f.quotes||0; o+=f.orders||0; t+=f.monthly_target_orders||0; });
  return { enquiries:e, quotes:q, orders:o, target:t,
    enqToQuote: safeDiv(q,e), quoteToOrder: safeDiv(o,q), overall: safeDiv(o,e) };
}
function aggSegment(months){
  const out = { Attachments:{deals:0,value:0}, Utility:{deals:0,value:0} };
  months.forEach(m=>{
    const st = DATA[m].segment_table || {};
    Object.keys(st).forEach(seg=>{
      if(!out[seg]) out[seg] = {deals:0,value:0};
      Object.values(st[seg]).forEach(p=>{ out[seg].deals += p.deals||0; out[seg].value += p.value||0; });
    });
  });
  return out;
}

  months.forEach(m=>{
    const st = DATA[m].segment_table || {};
    Object.keys(st).forEach(seg=>{
      Object.entries(st[seg]).forEach(([person,v])=>{
        out[person] = out[person] || {Attachments:{deals:0,value:0}, Utility:{deals:0,value:0}};
        if(!out[person][seg]) out[person][seg] = {deals:0,value:0};
        out[person][seg].deals += v.deals||0;
        out[person][seg].value += v.value||0;
      });
    });
  });
  return out;
}
function aggSalespeople(months){
  const out = {};
  months.forEach(m=>{
    const sr = DATA[m].salesperson_rates || {};
    Object.entries(sr).forEach(([person,v])=>{
      out[person] = out[person] || { enq:[], quo:[], ovr:[], gapsEQ:0, gapsQO:0, wasted:0 };
      if(v.enq_to_quotes!=null) out[person].enq.push(v.enq_to_quotes);
      if(v.quotes_to_deals!=null) out[person].quo.push(v.quotes_to_deals);
      if(v.overall!=null) out[person].ovr.push(v.overall);
      out[person].gapsEQ += v.gaps_enq_to_quote||0;
      out[person].gapsQO += v.gaps_quote_to_order||0;
      out[person].wasted += v.amount_wasted||0;
    });
  });
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  Object.keys(out).forEach(p=>{
    out[p].enqToQuoteAvg = avg(out[p].enq);
    out[p].quoteToOrderAvg = avg(out[p].quo);
    out[p].overallAvg = avg(out[p].ovr);
  });
  return out;
}
function aggUncaptured(months){
  let rows = [];
  months.forEach(m => rows = rows.concat((DATA[m].uncaptured_demand||[]).map(r=>({...r, month:m}))));
  const byPerson = {}, byReason = {};
  let totalCount = 0;
  rows.forEach(r=>{
    const n = (r.enquiries==null) ? 1 : r.enquiries;
    totalCount += n;
    const p = r.salesperson || 'Not stated';
    byPerson[p] = byPerson[p] || {count:0, value:0};
    byPerson[p].count += n; byPerson[p].value += r.value||0;
    const rs = r.reason || 'Not stated';
    byReason[rs] = byReason[rs] || {count:0, value:0};
    byReason[rs].count += n; byReason[rs].value += r.value||0;
  });
  return { rows, byPerson, byReason, totalCount, totalValue: rows.reduce((a,r)=>a+(r.value||0),0) };
}
function aggQuality(months){
  let rows = [];
  months.forEach(m => rows = rows.concat((DATA[m].quality_log||[]).map(r=>({...r, month:m}))));
  const byReason = {}, byAccountability = {};
  let complaints=0, cancellations=0;
  rows.forEach(r=>{
    complaints += r.complaints||0;
    const cv=(r.cancellation||'').toString().toLowerCase(); if(cv==='yes'||cv==='part') cancellations++;
    const rc = r.reason_category || 'Not stated';
    byReason[rc] = byReason[rc] || {count:0};
    byReason[rc].count++;
    const ac = r.accountability || 'Not stated';
    byAccountability[ac] = byAccountability[ac] || {count:0};
    byAccountability[ac].count++;
  });
  return { rows, byReason, byAccountability, complaints, cancellations, totalRows: rows.length };
}

}

function fmtDMY(ds){
  if(!ds) return '';
  const p = String(ds).split('-');
  return p.length===3 ? p[2] + '/' + p[1] + '/' + p[0] : ds;
}

function allPeople(months){
  const s = new Set();
  months.forEach(m=>{
    const d = DATA[m];
    Object.keys(d.salesperson_counts||{}).forEach(p=>s.add(p));
    Object.keys(d.salesperson_rates||{}).forEach(p=>s.add(p));
    ['Attachments','Utility'].forEach(sg=>Object.keys((d.segment_table||{})[sg]||{}).forEach(p=>s.add(p)));
    (d.uncaptured_demand||[]).forEach(r=>{ if(r.salesperson) s.add(r.salesperson); });
    (d.quality_log||[]).forEach(r=>{ if(r.salesperson) s.add(r.salesperson); });
  });
  return Array.from(s).sort();
}

function aggCounts(months){
  const people = {};
  const assigned = { enquiries:0, quotes:0, orders:0 };
  months.forEach(m=>{
    const c = DATA[m].salesperson_counts || {};
    Object.entries(c).forEach(([p,v])=>{
      people[p] = people[p] || { enquiries:0, quotes:0, orders:0 };
      ['enquiries','quotes','orders'].forEach(k=>{ people[p][k] += v[k]||0; assigned[k] += v[k]||0; });
    });
  });
  const f = aggFunnel(months);
  const company = { enquiries:f.enquiries, quotes:f.quotes, orders:f.orders };
  const unassigned = {
    enquiries: company.enquiries - assigned.enquiries,
    quotes: company.quotes - assigned.quotes,
    orders: company.orders - assigned.orders
  };
  return { people, company, unassigned };
}

function convRates(c){
  return { enqToQuote: safeDiv(c.quotes, c.enquiries), quoteToOrder: safeDiv(c.orders, c.quotes), overall: safeDiv(c.orders, c.enquiries) };
}

function qualityByPerson(rows){
  const out = {};
  rows.forEach(r=>{
    const p = r.salesperson || 'Not stated';
    out[p] = out[p] || { incidents:0, complaints:0, cancellations:0 };
    out[p].incidents++;
    out[p].complaints += r.complaints||0;
    const cv = (r.cancellation||'').toString().toLowerCase();
    if(cv==='yes' || cv==='part') out[p].cancellations++;
  });
  return out;
}

function segTotals(seg){
  const deals = (seg.Attachments.deals||0) + (seg.Utility.deals||0);
  const value = (seg.Attachments.value||0) + (seg.Utility.value||0);
  return { deals, value };
}

function emptySeg(){ return { Attachments:{deals:0,value:0}, Utility:{deals:0,value:0} }; }

const NAME_ALIAS = {

};
function canonName(n){
  if(typeof n !== 'string') return n;
  const t = n.trim();
  if(!t) return null;
  return NAME_ALIAS[t.toLowerCase()] || t;
}

const MONTH_NAME_MAP = {
  jan:'Jan', january:'Jan', feb:'Feb', february:'Feb', mar:'Mar', march:'Mar',
  apr:'Apr', april:'Apr', may:'May', jun:'Jun', june:'Jun', jul:'Jul', july:'Jul',
  aug:'Aug', august:'Aug', sep:'Sep', sept:'Sep', september:'Sep',
  oct:'Oct', october:'Oct', nov:'Nov', november:'Nov', dec:'Dec', december:'Dec'
};
function detectMonthKey(sheetName){
  const m = String(sheetName).trim().match(/^([A-Za-z]+)\s+(\d{4})$/);
  if(!m) return null;
  if(parseInt(m[2],10) !== DASH_YEAR) return null;
  return MONTH_NAME_MAP[m[1].toLowerCase()] || null;
}
function isNum(v){ return typeof v === 'number' && !isNaN(v); }
const DATE_RE = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
function isDateish(v){
  if(v instanceof Date) return true;
  if(typeof v === 'string' && DATE_RE.test(v.trim())) return true;
  return false;
}
function fmtDate(v){
  if(v instanceof Date){
    const y = v.getFullYear(), mo = String(v.getMonth()+1).padStart(2,'0'), d = String(v.getDate()).padStart(2,'0');
    return `${y}-${mo}-${d}`;
  }
  if(typeof v === 'string' && DATE_RE.test(v.trim())){
    const [d,m,y] = v.trim().split('/'); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}
function cleanText(v){
  if(v == null) return null;
  const t = String(v).trim();
  return t ? t : null;
}
function findCell(grid, text){
  const t = text.toLowerCase();
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<(grid[r]?grid[r].length:0);c++){
      const v = grid[r][c];
      if(typeof v==='string' && v.toLowerCase().includes(t)) return [r,c];
    }
  }
  return [null,null];
}
function headerMap(row, from, to){
  const hm = {};
  for(let ci=from; ci<to; ci++){
    const v = (row||[])[ci];
    if(typeof v==='string' && v.trim()) hm[v.trim()] = ci;
  }
  return hm;
}

function addCount(out, nm, metric, v){
  if(!nm || !isNum(v)) return;
  if(!out[nm]) out[nm] = { enquiries:0, quotes:0, orders:0 };
  out[nm][metric] += v;
}

function findTotalRow(grid, fromRow, toRow){
  for(let r=fromRow; r<Math.min(toRow, grid.length); r++){
    const row = grid[r]||[];
    for(let c=0;c<row.length;c++){
      if(typeof row[c]==='string' && row[c].trim().toLowerCase()==='total') return r;
    }
  }
  return null;
}

function parsePersonCountsA(grid){
  const out = {};
  const re = /^\s*(.+?)\s*[\u2013\u2014-]\s*(Enquiries|Quotes|Orders)\s*$/i;
  for(let r=0;r<grid.length;r++){
    const row = grid[r]||[];
    const found = [];
    row.forEach((v,ci)=>{
      if(typeof v==='string'){
        const m = v.match(re);
        if(m) found.push({ nm: canonName(m[1]), metric: m[2].toLowerCase(), col: ci });
      }
    });
    if(found.length>=3){
      const tr = findTotalRow(grid, r+1, r+45);
      if(tr==null) return out;
      found.forEach(f=>{ addCount(out, f.nm, f.metric, (grid[tr]||[])[f.col]); });
      return out;
    }
  }
  return out;
}

function parsePersonCountsB(grid, funnelHeaderRow){
  const out = {};
  for(let r=funnelHeaderRow+25; r<grid.length-2; r++){
    const row = grid[r]||[];
    const enqCols = [];
    row.forEach((v,ci)=>{ if(typeof v==='string' && v.trim()==='Enquiries') enqCols.push(ci); });
    const next = grid[r+1]||[];
    if(enqCols.length>=2 && next.some(v=>typeof v==='string' && v.trim()==='Attachments')){
      const nameRow = grid[r-1]||[];
      const tr = findTotalRow(grid, r+2, r+60);
      if(tr==null) return out;
      const tot = grid[tr]||[];
      const n = x => isNum(x) ? x : 0;
      enqCols.forEach(c=>{
        const nm = canonName(nameRow[c+2]);
        addCount(out, nm, 'enquiries', n(tot[c]) + n(tot[c+1]));
        addCount(out, nm, 'quotes', n(tot[c+2]) + n(tot[c+3]));
        addCount(out, nm, 'orders', n(tot[c+4]) + n(tot[c+5]));
      });
      return out;
    }
  }
  return out;
}

function parseSheetToMonthData(grid){
  const entry = { funnel:{}, salesperson_rates:{}, salesperson_counts:{}, segment_table:{}, uncaptured_demand:[], quality_log:[] };
  let hrow=null, dcol=null;
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<(grid[r]?grid[r].length:0);c++){
      if(grid[r][c]==='Date' && typeof grid[r][c+1]==='string' && grid[r][c+1].includes('Session')){
        hrow=r; dcol=c; break;
      }
    }
    if(hrow!==null) break;
  }
  if(hrow===null) return entry;
  const header = grid[hrow];
  const hmap = {};
  header.forEach((v,ci)=>{ if(typeof v==='string' && v.trim()) hmap[v.trim()]=ci; });
  const isTypeB = header[dcol+2]==='Attachments';
  let monthlyTarget=null;
  const mtCol = hmap['Monthly Target Orders'];
  if(mtCol!=null){ for(let r=hrow+1;r<Math.min(hrow+3,grid.length);r++){ if(isNum(grid[r][mtCol])){ monthlyTarget=grid[r][mtCol]; break; } } }
  let sumE=0,sumQ=0,sumO=0, blanks=0, r=hrow+1, days=0;
  while(r<grid.length){
    const row = grid[r]||[];
    const dval = row[dcol];
    if(typeof dval==='string' && dval.trim()==='Date') break;
    if(isDateish(dval)){
      blanks=0; days++;
      if(!isTypeB){
        const ecol=hmap['Enquiries'], gcol=hmap['Quotes'], icol=hmap['Orders'];
        if(isNum(row[ecol])) sumE+=row[ecol];
        if(isNum(row[gcol])) sumQ+=row[gcol];
        if(isNum(row[icol])) sumO+=row[icol];
      } else {
        [dcol+2,dcol+3].forEach(cc=>{ if(isNum(row[cc])) sumE+=row[cc]; });
        [dcol+4,dcol+5].forEach(cc=>{ if(isNum(row[cc])) sumQ+=row[cc]; });
        [dcol+6,dcol+7].forEach(cc=>{ if(isNum(row[cc])) sumO+=row[cc]; });
      }
    } else {
      blanks++; if(blanks>=3 && days>0) break;
    }
    r++; if(r-hrow>45) break;
  }
  entry.funnel = { type_b:isTypeB, monthly_target_orders:monthlyTarget, enquiries:sumE, quotes:sumQ, orders:sumO };
  entry.salesperson_counts = isTypeB ? parsePersonCountsB(grid, hrow) : parsePersonCountsA(grid);

  const [er,ec] = findCell(grid, 'enq to quotes');
  if(er!=null){
    const nameRow = er-1;
    for(let ci=ec+1; ci<ec+8; ci++){
      const v=(grid[nameRow]||[])[ci];
      if(typeof v==='string' && v.trim() && v.trim()!=='Segment'){
        const nm = canonName(v);
        const gv = rr => { const x=(grid[rr]||[])[ci]; return isNum(x)?x:null; };
        const rec = { enq_to_quotes:gv(er), quotes_to_deals:gv(er+1), overall:gv(er+2), gaps_enq_to_quote:0, gaps_quote_to_order:0, amount_wasted:0 };
        if(!entry.salesperson_rates[nm]) entry.salesperson_rates[nm] = rec;
        else ['enq_to_quotes','quotes_to_deals','overall'].forEach(k=>{ if(entry.salesperson_rates[nm][k]==null) entry.salesperson_rates[nm][k]=rec[k]; });
      }
    }
    const [gr,gc] = findCell(grid, 'gaps enq to quote');
    if(gr!=null){
      let cost = 35;
      const [cr,cc] = findCell(grid, 'Enquiry cost');
      if(cr!=null){
        for(let ci=cc+1; ci<cc+8; ci++){
          const v=(grid[cr]||[])[ci];
          if(isNum(v) && v>0){ cost=v; break; }
        }
      }
      const gnameRow = gr-1;
      for(let ci=gc+1; ci<gc+8; ci++){
        const v=(grid[gnameRow]||[])[ci];
        if(typeof v==='string' && v.trim()){
          const nm = canonName(v);
          const gv = rr => { const x=(grid[rr]||[])[ci]; return isNum(x)?x:0; };
          if(!entry.salesperson_rates[nm]) entry.salesperson_rates[nm] = {enq_to_quotes:null,quotes_to_deals:null,overall:null,gaps_enq_to_quote:0,gaps_quote_to_order:0,amount_wasted:0};
          const eqRaw = gv(gr), qoRaw = gv(gr+1);
          const eqCount = isTypeB ? Math.round(eqRaw/cost*100)/100 : eqRaw;
          const qoCount = isTypeB ? Math.round(qoRaw/cost*100)/100 : qoRaw;
          const rec2 = entry.salesperson_rates[nm];
          rec2.gaps_enq_to_quote += eqCount;
          rec2.gaps_quote_to_order += qoCount;
          rec2.amount_wasted += (eqCount + qoCount) * cost;
        }
      }
    }
  }

  const [sr] = findCell(grid, 'Total deals per Segment');
  if(sr!=null){
    const cols = [];
    (grid[sr]||[]).forEach((v,ci)=>{ if(typeof v==='string' && v.trim()) cols.push([ci, v.trim()]); });
    const nameCols = cols.filter(([ci,v])=> !v.toLowerCase().includes('value') && !['segment','total deals per segment','total amount per segment'].includes(v.toLowerCase()));
    const valueCols = cols.filter(([ci,v])=> v.toLowerCase().includes('value'));
    const pairs = nameCols.map((nc,i)=>[nc, valueCols[i]]).filter(p=>p[1]);
    const segCol = cols.length?cols[0][0]:0;
    for(let off=1; off<6; off++){
      const rr = sr+off; if(rr>=grid.length) break;
      const segname = (grid[rr]||[])[segCol];
      if(typeof segname==='string' && (segname.trim()==='Attachments'||segname.trim()==='Utility')){
        const segEntry = {};
        pairs.forEach(([[nci,nname],[vci]])=>{
          const nm = canonName(nname);
          const deals=(grid[rr]||[])[nci], val=(grid[rr]||[])[vci];
          const rec = { deals:isNum(deals)?deals:0, value:isNum(val)?val:0 };
          if(!segEntry[nm]) segEntry[nm] = rec;
          else { segEntry[nm].deals += rec.deals; segEntry[nm].value += rec.value; }
        });
        entry.segment_table[segname.trim()] = segEntry;
      }
    }
  }

  const [ur] = findCell(grid, 'Uncaptured Demand');
  if(ur!=null){
    const hr = ur+1;
    const hrow2 = grid[hr]||[];
    const dateCols = [];
    hrow2.forEach((v,ci)=>{ if(typeof v==='string' && v.trim()==='Date') dateCols.push(ci); });
    const u0 = dateCols[0];
    const q0 = dateCols.length>1 ? dateCols[1] : null;
    if(u0!=null){
      const uh = headerMap(hrow2, u0, q0!=null?q0:hrow2.length);
      let uvcol=null; Object.keys(uh).forEach(k=>{ if(k.includes('Estimated Value')) uvcol=uh[k]; });
      let rr=hr+1, bl=0, last=null;
      while(rr<grid.length && bl<6){
        const row=grid[rr]||[];
        const dval=row[u0];
        if(typeof dval==='string' && dval.trim().toLowerCase()==='total') break;
        const prod = cleanText(row[uh['Product']]);
        const val = (uvcol!=null && isNum(row[uvcol])) ? row[uvcol] : 0;
        if(isDateish(dval)){
          bl=0;
          const en = uh['Enquiries']!=null && isNum(row[uh['Enquiries']]) ? row[uh['Enquiries']] : 1;
          last = {
            date: fmtDate(dval), enquiries: en,
            salesperson: canonName(row[uh['Sales person']]),
            product: prod,
            reason: cleanText(row[uh['Reason']]),
            value: val
          };
          entry.uncaptured_demand.push(last);
        } else if(last && (prod || val)){
          bl=0;
          entry.uncaptured_demand.push({
            date: last.date, enquiries: 0, salesperson: last.salesperson,
            product: prod, reason: cleanText(row[uh['Reason']]) || last.reason, value: val
          });
        } else bl++;
        rr++;
      }
    }
    if(q0!=null){
      const qh = headerMap(hrow2, q0, hrow2.length);
      let rr=hr+1, bl=0, lastQ=null;
      while(rr<grid.length && bl<6){
        const row=grid[rr]||[];
        const dval=row[q0];
        if(typeof dval==='string' && dval.trim().toLowerCase()==='total') break;
        if(isDateish(dval)){
          bl=0;
          let canc = row[qh['Cancellations']];
          if(isNum(canc)) canc = canc>0 ? 'Yes' : 'No';
          else canc = cleanText(canc);
          const iss = row[qh['Issue']];
          lastQ = {
            date: fmtDate(dval),
            order_no: cleanText(row[qh['Order No']]),
            salesperson: canonName(row[qh['Salesperson']]),
            product: cleanText(row[qh['Product']]),
            issue: typeof iss==='string' ? cleanText(iss) : null,
            complaints: isNum(row[qh['Complaints']]) ? row[qh['Complaints']] : 0,
            cancellation: canc,
            reason_category: cleanText(row[qh['Reason Category']]),
            accountability: cleanText(row[qh['Accountability']]),
            action_taken: cleanText(row[qh['Action Taken']])
          };
          entry.quality_log.push(lastQ);
        } else if(lastQ && !cleanText(row[qh['Order No']]) && (cleanText(row[qh['Product']]) || isNum(row[qh['Complaints']]))){
          bl=0;
          const cp = cleanText(row[qh['Product']]);
          if(cp) lastQ.product = lastQ.product ? lastQ.product + ', ' + cp : cp;
          if(isNum(row[qh['Complaints']])) lastQ.complaints += row[qh['Complaints']];
        } else bl++;
        rr++;
      }
    }
  }
  return entry;
}

function fixLogDate(ds, mnum){
  if(!ds) return ds;
  const p = ds.split('-');
  const y = p[0], m = parseInt(p[1],10), d = parseInt(p[2],10);
  if(m !== mnum && d === mnum){
    return y + '-' + String(mnum).padStart(2,'0') + '-' + String(m).padStart(2,'0');
  }
  return ds;
}

function parseWorkbookToData(wb){
  const out = {};
  wb.SheetNames.forEach(sname=>{
    const mkey = detectMonthKey(sname);
    if(!mkey) return;
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sname], { header:1, raw:true, defval:null });
    const parsed = parseSheetToMonthData(grid);
    if(!parsed.funnel || (!parsed.funnel.enquiries && !parsed.funnel.orders)) return;
    const mnum = monthIndex(mkey) + 1;
    parsed.uncaptured_demand.forEach(r=>{ r.date = fixLogDate(r.date, mnum); });
    parsed.quality_log.forEach(r=>{ r.date = fixLogDate(r.date, mnum); });
    out[mkey] = { full: sname, quarter: 'Q' + (Math.floor(monthIndex(mkey)/3)+1), ...parsed };
  });
  return out;
}

function setStatus(text){
  const el2 = document.getElementById('fname');
  if(el2) el2.textContent = text;
}
function fmtStamp(d){
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

let storeRef = null;
let storeReady = false;

function applyStoredData(newData, fileName, stamp){
  const hasCounts = Object.values(newData).some(m=>m && m.salesperson_counts && Object.keys(m.salesperson_counts).length);
  if(!hasCounts){ setStatus('Saved data is from an older version. Upload your Excel file again.'); return; }
  const before = new Set(availableMonths());
  DATA = newData;
  availableMonths().forEach(m=>{ if(!before.has(m)) state.months.add(m); });
  Array.from(state.months).forEach(m=>{ if(!DATA[m]) state.months.delete(m); });
  if(!state.months.size) availableMonths().forEach(m=>state.months.add(m));
  const when = stamp ? ' · ' + fmtStamp(stamp) : '';
  setStatus('Updated' + when + (fileName ? ' · ' + fileName : ''));
  renderAll();
}

function saveData(fileName){
  const payload = JSON.stringify(DATA);
  if(storeReady && storeRef){
    return storeRef.set({ payload, fileName, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({ payload, fileName, savedAt: Date.now() })); }catch(e){}
  return Promise.resolve();
}

function initStore(){
  if(FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      firebase.auth().signInAnonymously().then(()=>{
        storeRef = firebase.firestore().collection(STORE_COLLECTION).doc(STORE_DOC);
        storeReady = true;
        storeRef.onSnapshot(snap=>{
          if(snap.exists){
            const d = snap.data();
            try{
              const stamp = d.updatedAt && d.updatedAt.toDate ? d.updatedAt.toDate() : null;
              applyStoredData(JSON.parse(d.payload), d.fileName, stamp);
            }catch(e){}
          }
        });
      }).catch(()=>{ setStatus('Could not connect to shared storage'); });
      return;
    }catch(e){}
  }
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){
      const s = JSON.parse(raw);
      applyStoredData(JSON.parse(s.payload), s.fileName, s.savedAt ? new Date(s.savedAt) : null);
    }
  }catch(e){}
}

document.getElementById('uploadBtn').addEventListener('click', function(){
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, { type:'array', cellDates:true });
      const parsed = parseWorkbookToData(wb);
      const months = Object.keys(parsed);
      if(!months.length){
        setStatus('No ' + DASH_YEAR + ' month sheets found in ' + file.name);
        return;
      }
      const merged = JSON.parse(JSON.stringify(DATA));
      months.forEach(m=>{ merged[m] = parsed[m]; });
      applyStoredData(merged, file.name, new Date());
      saveData(file.name).catch(()=>{ setStatus('Loaded, but could not save to shared storage'); });
    } catch(err){
      setStatus('Could not read file: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
});

initStore();
